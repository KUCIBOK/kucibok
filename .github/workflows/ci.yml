# P5-TEST-002 — Pipeline CI/CD Kucibok
#
# Déclenché sur :
#   - push vers main ou dev
#   - pull request vers main
#
# Jobs :
#   1. test     : Jest (tests unitaires + intégration)
#   2. audit    : npm audit (vulnérabilités de sécurité)
#   3. lint     : ESLint + eslint-plugin-security (optionnel, non bloquant)
#   4. secrets  : Gitleaks (prévenir les fuites de secrets)
#
# Un seul job qui échoue → la PR ne peut pas être mergée (branch protection rules).

name: CI — Tests & Sécurité

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — Tests Jest
  # ---------------------------------------------------------------------------
  test:
    name: Tests Jest (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests avec couverture
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-not-used-in-production
          API_KEY: ci-test-api-key-12345
          MONGODB_URI: mongodb://localhost:27017/kucibok_test

      - name: Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 2 — npm audit (vulnérabilités)
  # ---------------------------------------------------------------------------
  audit:
    name: Audit de sécurité npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit backend (high + critical uniquement)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Audit frontend (high + critical uniquement)
        working-directory: frontend
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # JOB 3 — Détection de secrets (Gitleaks)
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Scan de secrets (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour scanner tout l'historique

      - name: Gitleaks — Détection de secrets dans le code
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # JOB 4 — Frontend build check
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production
        run: npm run build
        env:
          VITE_API_URL: https://api.kucibok.io
          VITE_API_KEY: ci-build-placeholder-key
